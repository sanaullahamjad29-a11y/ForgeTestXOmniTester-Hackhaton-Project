version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
    volumes:
      - testforge_artifacts:/srv/app/artifacts

  frontend:
    image: node:20-alpine
    working_dir: /srv/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/srv/frontend
    depends_on:
      - backend

volumes:
  testforge_artifacts:
